<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlowCalc — Fill-Height Console</title>
<style>
/* FONTS */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

/* DESIGN TOKENS */
:root {
  color-scheme: light;
  --bg:            #F4F7FA;
  --bg-grid:       #E2E8F0;
  --panel:         #FFFFFF;
  --panel-solid:   #FFFFFF;
  --panel-border:  #E2E8F0;
  --panel-border-strong: #CBD5E1;
  --text:          #0F172A;
  --text-dim:      #475569;
  --text-faint:    #94A3B8;
  --teal:          #0EA5E9; 
  --teal-dim:      #0284C7;
  --amber:         #F59E0B;
  --amber-dim:     #D97706;
  --red:           #EF4444;
  --red-dim:       #DC2626;
  --water-a:       #38BDF8;
  --water-b:       #06B6D4;
  --water-c:       #0284C7;
  --water-overflow-a: #EF4444;
  --water-overflow-b: #F87171;
  --input-bg:      #FFFFFF;
  --input-border:  #CBD5E1;
  --input-focus:   rgba(14, 165, 233, 0.15);
  --tab-bg:        #F8FAFC;
  --tab-hover:     #F1F5F9;
  --readout-bg:    #F8FAFC;
  --readout-hover: #F1F5F9;
  --tank-fill:     #F8FAFC;
  --tank-outline:  #CBD5E1;
  --glass-1:       rgba(255, 255, 255, 0.7);
  --glass-2:       rgba(255, 255, 255, 0.1);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.02);
  --panel-shadow-hover: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
  --font-ui: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg:            #060B14;
  --bg-grid:       #0A1220;
  --panel:         rgba(18,28,44,0.72);
  --panel-solid:   #101B2C;
  --panel-border:  rgba(101,168,204,0.18);
  --panel-border-strong: rgba(101,168,204,0.34);
  --text:          #E8F1F8;
  --text-dim:      #7E93A8;
  --text-faint:    #4C6178;
  --teal:          #2CE0C9;
  --teal-dim:      #1B7A6E;
  --input-bg:      rgba(6,11,20,0.4);
  --input-border:  var(--panel-border-strong);
  --input-focus:   rgba(44,224,201,0.15);
  --tab-bg:        rgba(127,147,168,0.05);
  --tab-hover:     rgba(127,147,168,0.1);
  --readout-bg:    rgba(127,147,168,0.05);
  --readout-hover: rgba(127,147,168,0.08);
  --tank-fill:     rgba(127,147,168,0.06);
  --tank-outline:  var(--panel-border-strong);
  --glass-1:       rgba(255, 255, 255, 0.15);
  --glass-2:       rgba(255, 255, 255, 0.01);
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  --panel-shadow-hover: 0 30px 60px -15px rgba(0,0,0,0.6);
}

*{ box-sizing:border-box; }
html, body { margin: 0; padding: 0; width: 100%; max-width: 100vw; overflow-x: hidden; }

body{
  background: radial-gradient(circle at 15% 0%, rgba(14, 165, 233, 0.06), transparent 45%), radial-gradient(circle at 100% 20%, rgba(6, 182, 212, 0.04), transparent 40%), var(--bg);
  background-attachment: fixed; color: var(--text); font-family: var(--font-ui); min-height: 100vh;
  -webkit-font-smoothing: antialiased; transition: background-color .4s ease, color .4s ease;
}
body::before{
  content:""; position:fixed; inset:0;
  background-image: linear-gradient(var(--bg-grid) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 40px 40px; opacity:.6; pointer-events:none; z-index:0;
}
::selection{ background: var(--teal); color:#fff; }
button, select, input{ font-family: inherit; }
a{ color: var(--teal); }
button:focus-visible, select:focus-visible, input:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

.wrap{ position:relative; z-index:1; max-width:1100px; width: 100%; margin:0 auto; padding: 20px 20px 60px; overflow-x: hidden;}
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding: 16px 20px; border:1px solid var(--panel-border); background: var(--panel); backdrop-filter: blur(20px); border-radius: var(--radius-lg); margin-bottom: 24px; box-shadow: var(--shadow); width: 100%;}
.brand{ display:flex; align-items:center; gap:14px; }
.brand-mark{ width:44px; height:44px; border-radius:12px; background: linear-gradient(135deg, var(--water-b), var(--water-a)); display:flex; align-items:center; justify-content:center; box-shadow: 0 0 0 1px rgba(255,255,255,0.4) inset, 0 8px 16px -4px rgba(14, 165, 233, 0.4); flex-shrink:0;}
.brand-mark svg{ width:24px; height:24px; color: #fff; }
.brand-text .eyebrow{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:.15em; color: var(--teal); text-transform:uppercase; font-weight: 700;}
.brand-text h1{ margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; color: var(--text); }
.controls-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

.segmented{ display:inline-flex; background: var(--tab-bg); border:1px solid var(--panel-border); border-radius: 999px; padding:4px; gap:2px; }
.segmented button{ border:none; background:transparent; color:var(--text-dim); padding:8px 16px; border-radius:999px; font-size:13px; font-weight:700; font-family: var(--font-mono); cursor:pointer; transition: all .2s ease;}
.segmented button.active{ background: var(--teal); color:#fff; box-shadow: 0 4px 12px -2px var(--teal-dim); }
.segmented button:hover:not(.active){ color:var(--text); background: var(--tab-hover);}

.icon-btn{ width:44px; height:44px; border-radius:12px; border:1px solid var(--panel-border); background: var(--tab-bg); color: var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; transition: all .2s ease;}
.icon-btn:hover{ border-color: var(--panel-border-strong); background: var(--tab-hover); color: var(--text); transform: translateY(-1px);}
.icon-btn svg{ width:20px; height:20px; }

.grid{ display:grid; grid-template-columns: 1fr 1fr; gap:24px; align-items:start; width: 100%; }
.panel{ border:1px solid var(--panel-border); background: var(--panel); backdrop-filter: blur(20px); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px; transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease; width: 100%;}
.panel:hover { box-shadow: var(--panel-shadow-hover); }
.panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:24px; }
.panel-head .tag{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--teal); font-weight: 700; margin-bottom: 4px;}
.panel-head h2{ margin:0; font-size:19px; font-weight:700; }

.field{ margin-bottom:18px; }
.field label{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-dim); margin-bottom:8px; font-weight:600; letter-spacing:.02em; }
.field label .unit-tag{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); background:var(--tab-bg); border: 1px solid var(--panel-border); padding:3px 6px; border-radius:6px; font-weight: 700;}
.field select, .field input[type="text"], .field input[type="number"]{ width:100%; padding:14px 16px; border-radius: var(--radius-sm); border:1px solid var(--input-border); background: var(--input-bg); color: var(--text); font-size:16px; font-family: var(--font-mono); font-weight:600; transition: all .2s ease;}
.field select:focus, .field input:focus{ border-color: var(--teal); box-shadow: 0 0 0 4px var(--input-focus); outline:none; }
.field .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.divider{ height:1px; background: var(--panel-border); margin: 24px 0; border:none; }
.shape-tabs{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:24px; }
.shape-tab{ border:1px solid var(--panel-border); background: var(--tab-bg); border-radius: var(--radius-md); padding:16px 8px; cursor:pointer; text-align:center; color: var(--text-dim); transition: all .2s ease;}
.shape-tab svg{ width:28px; height:28px; margin-bottom:8px; transition: transform .2s ease; }
.shape-tab span{ display:block; font-size:12px; font-weight:700; letter-spacing:.02em; }
.shape-tab.active{ border-color: var(--teal); color: var(--teal); background: var(--input-focus); box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.2) inset; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 20px; border-radius: var(--radius-sm); border:1px solid transparent; font-weight:700; font-size:15px; cursor:pointer; transition: all .2s ease; width:100%; min-height: 52px;}
.btn-ghost{ background: var(--tab-bg); border-color: var(--panel-border); color: var(--text); }
.btn-ghost:hover{ background: var(--tab-hover); border-color: var(--panel-border-strong); transform: translateY(-1px); }

.saved-row{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius: var(--radius-sm); background: var(--tab-bg); border:1px solid var(--panel-border); margin-bottom:8px;}
.saved-row .name{ flex:1; font-size:14px; font-weight:700;}
.saved-row button{ border:none; background:rgba(127,147,168,0.1); color:var(--text-dim); padding:10px; border-radius:8px; cursor:pointer;}
.empty-note{ font-size:13px; color: var(--text-faint); padding:12px; text-align: center;}

.viz-stage{ display:flex; align-items:center; justify-content:center; padding: 10px 0 20px; position: relative;}
.viz-svg-holder{ position:relative; width:220px; filter: drop-shadow(0 15px 30px rgba(14, 165, 233, 0.15));}
.viz-svg-holder svg{ width:100%; height:auto; display:block; overflow:visible; }

.readout-grid{ display:grid; grid-template-columns: 1fr; gap:16px; margin-top:20px; width: 100%;}
.readout{ border:1px solid var(--panel-border); border-radius: var(--radius-md); background: var(--readout-bg); padding:24px; text-align: center;}
.readout .label{ font-size:12px; text-transform:uppercase; letter-spacing:.15em; color:var(--text-faint); font-weight:700; margin-bottom: 12px;}
.readout .value{ font-family: var(--font-mono); font-size:42px; font-weight:700; color:var(--text);}
.readout .value .unit{ font-size:16px; color: var(--text-dim); margin-left:6px; font-weight: 600;}
.readout.accent { border-color: rgba(14, 165, 233, 0.4); background: var(--input-focus); }
.readout.accent .value{ color: var(--teal); }

.status-banner{ display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius: var(--radius-md); font-size:14px; font-weight:600; margin-top:24px; border:1px solid transparent;}
.status-banner.ok{ background: var(--input-focus); border-color: rgba(14, 165, 233, 0.3); color: var(--teal-dim); }
.status-banner.overflow{ background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--red); }
.status-banner.error{ background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); color: var(--red); }

.water-group { transition: transform 1.5s cubic-bezier(0.25, 1.2, 0.5, 1); transform-origin: bottom;}
.wave-a { animation: waveScroll 3.5s infinite; opacity: 0.95; }
.wave-b { animation: waveScroll 5.5s infinite reverse; opacity: 0.6; }
.wave-c { animation: waveScroll 7s linear infinite; opacity: 0.35; transform: scaleY(1.2); }
@keyframes waveScroll{ from{ transform: translateX(0); } to{ transform: translateX(-80px); } }
.bubble { fill: rgba(255, 255, 255, 0.7); animation: rise 3s infinite; }
@keyframes rise { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-160px) scale(0.8); opacity: 0; } }

.target-line{ transition: y 1.2s cubic-bezier(0.25, 1.2, 0.5, 1); }
.mode-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding: 16px; background: var(--tab-bg); border-radius: var(--radius-md); border: 1px solid var(--panel-border);}
.switch{ position:relative; width:52px; height:28px; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.switch .track{ position:absolute; inset:0; background: var(--panel-border-strong); border-radius:999px; cursor:pointer; }
.switch .thumb{ position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition: transform .3s; }
.switch input:checked + .track{ background: var(--teal); }
.switch input:checked + .track .thumb{ transform: translateX(24px); }

@media (max-width: 940px){ .grid{ grid-template-columns: 1fr; gap: 20px; } }
@media (max-width: 600px){
  .wrap { padding: 12px 12px 40px; }
  .topbar { flex-direction: column; align-items: flex-start; }
  .readout .value { font-size: 36px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      <div class="brand-text"><div class="eyebrow">Smart Volume Engine</div><h1>FlowCalc</h1></div>
    </div>
    <div class="controls-row">
      <div class="segmented" id="unitToggle">
        <button data-unit="cm" class="active">CM</button>
        <button data-unit="in">IN</button>
        <button data-unit="ft">FT</button>
        <button data-unit="m">M</button>
      </div>
      <button class="icon-btn" id="themeToggle"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></button>
    </div>
  </header>

  <div class="grid">
    <div class="col-left">
      <section class="panel">
        <div class="panel-head"><div><div class="tag">01 · Tank Profile</div><h2>Select Tank Details</h2></div></div>
        <div class="field"><label>Brand</label><select id="brandSelect"></select></div>
        <div class="field" id="capacityField"><label>Standard Capacity</label><select id="capacitySelect"></select></div>
        <div class="field" id="savedTankField" style="display:none;"><label>Load Saved</label><select id="savedTankSelect"></select></div>
        <hr class="divider">
        <div class="shape-tabs" id="shapeTabs">
          <div class="shape-tab active" data-shape="vertical"><span>VERTICAL</span></div>
          <div class="shape-tab" data-shape="tapered"><span>TAPERED</span></div>
          <div class="shape-tab" data-shape="horizontal"><span>HORIZONTAL</span></div>
        </div>
        
        <div id="dimsVertical" class="dims-group">
          <div class="field row2">
            <div><label>Diameter <span class="unit-tag" data-unit-label>CM</span></label><input type="number" id="v_diameter"></div>
            <div><label>Height <span class="unit-tag" data-unit-label>CM</span></label><input type="number" id="v_height"></div>
          </div>
        </div>
        <div id="dimsTapered" class="dims-group" style="display:none;">
          <div class="field row2">
            <div><label>Bottom Ø <span class="unit-tag" data-unit-label>CM</span></label><input type="number" id="t_bottom"></div>
            <div><label>Top Ø <span class="unit-tag" data-unit-label>CM</span></label><input type="number" id="t_top"></div>
          </div>
          <div class="field"><label>Height <span class="unit-tag" data-unit-label>CM</span></label><input type="number" id="t_height"></div>
        </div>
        <div id="dimsHorizontal" class="dims-group" style="display:none;">
          <div class="field row2">
            <div><label>Diameter <span class="unit-tag" data-unit-label>CM</span></label><input type="number" id="h_diameter"></div>
            <div><label>Length <span class="unit-tag" data-unit-label>CM</span></label><input type="number" id="h_length"></div>
          </div>
        </div>
        <hr class="divider">
        <div class="mode-row">
          <div><div style="font-weight:700;">Outer Measured?</div><div style="font-size:12px; color:var(--text-faint);">Flip if measured outside</div></div>
          <label class="switch"><input type="checkbox" id="measureModeSwitch"><span class="track"><span class="thumb"></span></span></label>
        </div>
        <div class="field" id="wallThicknessField" style="display:none;">
          <label>Wall Thickness <span class="unit-tag">MM</span></label><input type="number" id="wallThickness" value="0">
        </div>
        <hr class="divider">
        <div class="field"><label>Save Current Tank</label><input type="text" id="customTankName" placeholder="Enter name..."></div>
        <button class="btn btn-ghost" id="saveTankBtn">Save Custom Tank</button>
        <div id="savedTanksList" style="margin-top:20px;"></div>
      </section>
    </div>

    <div class="col-right">
      <section class="panel">
        <div class="panel-head"><div><div class="tag">02 · Input Requirement</div><h2>Calculation Mode</h2></div></div>
        
        <div class="segmented" id="calcModeToggle" style="width:100%; display:flex; margin-bottom: 16px;">
          <button data-mode="vol2height" class="active" style="flex:1; border-radius: 999px 0 0 999px;">Liters ➔ Height</button>
          <button data-mode="height2vol" style="flex:1; border-radius: 0 999px 999px 0;">Height ➔ Liters</button>
        </div>

        <div class="field" id="volInputGroup" style="margin-bottom:0;">
          <label>Target Water Volume <span class="unit-tag">LITERS</span></label>
          <input type="number" id="requiredLiters" placeholder="e.g. 350" style="font-size: 24px; font-weight: 700; height: 64px; color: var(--teal);">
        </div>
        
        <div class="field" id="heightInputGroup" style="margin-bottom:0; display:none;">
          <label>Target Fill Height <span class="unit-tag" data-unit-label>CM</span></label>
          <input type="number" id="requiredHeight" placeholder="e.g. 50" style="font-size: 24px; font-weight: 700; height: 64px; color: var(--teal);">
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><div><div class="tag">03 · Live Visualizer</div><h2>Fill Status</h2></div></div>
        <div class="viz-stage"><div class="viz-svg-holder"><svg id="tankSvg" viewBox="0 0 240 320"></svg></div></div>
        <div id="statusBanner" class="status-banner ok"><span id="statusText">Enter details to calculate.</span></div>
        <div class="readout-grid">
          <div class="readout accent">
            <div class="label" id="readoutLabel">Target Fill Height</div>
            <div class="value" id="outHeight">0.0<span class="unit">cm</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const tankDB = {
  arpico: { "500": { d: 83,  h: 109 }, "1000": { d: 105, h: 143 }, "2000": { d: 133, h: 162 }, "5000": { d: 196, h: 191 } },
  anton:  { "500": { d: 84,  h: 108 }, "1000": { d: 106, h: 141 }, "2000": { d: 134, h: 160 }, "5000": { d: 198, h: 188 } },
  pes:    { "500": { d: 82,  h: 110 }, "1000": { d: 104, h: 145 }, "2000": { d: 132, h: 165 }, "5000": { d: 195, h: 195 } },
  ruby:   { "500": { d: 83,  h: 110 }, "1000": { d: 105, h: 142 }, "2000": { d: 135, h: 160 }, "5000": { d: 197, h: 190 } }
};
const UNIT_TO_CM = { cm: 1, in: 2.54, ft: 30.48, m: 100 };
const UNIT_LABEL = { cm: "CM", in: "IN", ft: "FT", m: "M" };

const state = {
  unit: "cm", theme: "light", brand: "arpico", capacity: "1000", shape: "vertical",
  dims: { diameter: 105, height: 143, bottomDiameter: 105, topDiameter: 90, length: 200 },
  measurementMode: "inner", wallThicknessMm: 0, requiredLiters: null, requiredHeight: null, calcMode: "vol2height"
};

function volCylinder(d, h){ return Math.PI * (d/2)**2 * Math.max(0, h); }
function volFrustum(b, t, H, h){ 
  if(H<=0) return 0; 
  let hh = Math.max(0, Math.min(h, H)); 
  let rh = (b/2) + ((t/2)-(b/2))*(hh/H); 
  return (Math.PI*hh/3)*((b/2)**2 + (b/2)*rh + rh**2); 
}
function volHorizontal(d, l, h){ 
  let hh = Math.max(0, Math.min(h, d)); 
  if(hh<=0) return 0; if(hh>=d) return Math.PI*(d/2)**2 * l; 
  let r = d/2, term = r-hh; 
  let area = r**2 * Math.acos(term/r) - term * Math.sqrt(Math.max(0, 2*r*hh - hh**2)); 
  return area * l; 
}
function solveHeightForVolume(volFn, target, maxH){
  let lo=0, hi=maxH; for(let i=0; i<60; i++){ let mid=(lo+hi)/2; if(volFn(mid)<target) lo=mid; else hi=mid; } return (lo+hi)/2;
}
function getEffectiveDims(){
  let t = state.measurementMode === "outer" ? state.wallThicknessMm/10 : 0; let d = state.dims;
  if(state.shape==="vertical") return { diameter: d.diameter-2*t, height: d.height-2*t };
  if(state.shape==="tapered") return { bottomDiameter: d.bottomDiameter-2*t, topDiameter: d.topDiameter-2*t, height: d.height-2*t };
  return { diameter: d.diameter-2*t, length: d.length-2*t };
}
function getVolFnAndMaxHeight(eff){
  if(state.shape==="vertical") return { volFn: h => volCylinder(eff.diameter, h), maxHeight: eff.height };
  if(state.shape==="tapered") return { volFn: h => volFrustum(eff.bottomDiameter, eff.topDiameter, eff.height, h), maxHeight: eff.height };
  return { volFn: h => volHorizontal(eff.diameter, eff.length, h), maxHeight: eff.diameter };
}
function cmToUnit(cm, u){ return cm / UNIT_TO_CM[u]; }
function unitToCm(v, u){ return v * UNIT_TO_CM[u]; }
function fmt(n, dp){ return isFinite(n) ? n.toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}) : "—"; }

const $ = id => document.getElementById(id);

Object.keys(tankDB).forEach(k => { let o = document.createElement("option"); o.value=k; o.textContent=k.toUpperCase(); $("brandSelect").appendChild(o); });
function popCap(){ $("capacitySelect").innerHTML=""; Object.keys(tankDB[state.brand]||{}).forEach(c => { let o = document.createElement("option"); o.value=c; o.textContent=c+" L"; $("capacitySelect").appendChild(o); }); }

$("brandSelect").addEventListener("change", e => { state.brand = e.target.value; popCap(); loadPreset(); calcRender(); });
$("capacitySelect").addEventListener("change", e => { state.capacity = e.target.value; loadPreset(); calcRender(); });
function loadPreset(){ let p = tankDB[state.brand]?.[state.capacity]; if(p) { state.dims.diameter=p.d; state.dims.height=p.h; refreshDims(); } }

document.querySelectorAll(".shape-tab").forEach(t => t.addEventListener("click", e => {
  state.shape = t.dataset.shape; 
  document.querySelectorAll(".shape-tab").forEach(tt=>tt.classList.toggle("active", tt===t));
  $("dimsVertical").style.display = state.shape==="vertical"?"block":"none";
  $("dimsTapered").style.display = state.shape==="tapered"?"block":"none";
  $("dimsHorizontal").style.display = state.shape==="horizontal"?"block":"none";
  calcRender();
}));

function bindInp(id, setter){ $(id).addEventListener("input", e=>{ let v=parseFloat(e.target.value); setter(isFinite(v)?unitToCm(v,state.unit):0); calcRender(); }); }
bindInp("v_diameter", v=>state.dims.diameter=v); bindInp("v_height", v=>state.dims.height=v);
bindInp("t_bottom", v=>state.dims.bottomDiameter=v); bindInp("t_top", v=>state.dims.topDiameter=v); bindInp("t_height", v=>state.dims.height=v);
bindInp("h_diameter", v=>state.dims.diameter=v); bindInp("h_length", v=>state.dims.length=v);
function refreshDims(){
  $("v_diameter").value = cmToUnit(state.dims.diameter, state.unit).toFixed(1); $("v_height").value = cmToUnit(state.dims.height, state.unit).toFixed(1);
}

$("calcModeToggle").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#calcModeToggle button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.calcMode = e.target.getAttribute("data-mode");
  $("volInputGroup").style.display = state.calcMode === "vol2height" ? "block" : "none";
  $("heightInputGroup").style.display = state.calcMode === "height2vol" ? "block" : "none";
  calcRender();
});

$("requiredLiters").addEventListener("input", e => { let v=parseFloat(e.target.value); state.requiredLiters = isFinite(v)?v:null; calcRender(); });
$("requiredHeight").addEventListener("input", e => { let v=parseFloat(e.target.value); state.requiredHeight = isFinite(v)?unitToCm(v, state.unit):null; calcRender(); });

$("unitToggle").addEventListener("click", e=>{
  let b = e.target.closest("button"); if(!b) return; state.unit = b.dataset.unit;
  document.querySelectorAll("#unitToggle button").forEach(btn=>btn.classList.toggle("active", btn===b));
  document.querySelectorAll("[data-unit-label]").forEach(el=>el.textContent=UNIT_LABEL[state.unit]);
  refreshDims(); calcRender();
});

$("themeToggle").addEventListener("click", () => {
  state.theme = state.theme==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme", state.theme);
});

function calculate(){
  let eff = getEffectiveDims();
  if(Object.values(eff).some(v=>!isFinite(v)||v<=0)) return {valid:false, reason:"dims"};
  let { volFn, maxHeight } = getVolFnAndMaxHeight(eff);
  let maxVolCm3 = volFn(maxHeight);
  let maxCapL = maxVolCm3 / 1000;

  if (state.calcMode === "vol2height") {
    if(!state.requiredLiters || state.requiredLiters<=0) return {valid:false, reason:"req", maxCapL};
    let target = state.requiredLiters*1000, overflow = target>maxVolCm3;
    let h = solveHeightForVolume(volFn, overflow?maxVolCm3:target, maxHeight);
    return { valid:true, mode:"v2h", h, maxCapL, pct: maxHeight>0?(h/maxHeight)*100:0, over: overflow, liters: state.requiredLiters };
  } else {
    if(!state.requiredHeight || state.requiredHeight<=0) return {valid:false, reason:"req", maxCapL};
    let h = state.requiredHeight, overflow = h>maxHeight;
    let ch = overflow?maxHeight:h;
    let calcLiters = volFn(ch)/1000;
    return { valid:true, mode:"h2v", h:ch, maxCapL, pct: maxHeight>0?(ch/maxHeight)*100:0, over: overflow, liters: calcLiters };
  }
}

function calcRender(){
  let res = calculate();
  let readoutLbl = $("readoutLabel"), outH = $("outHeight"), stxt = $("statusText"), sb = $("statusBanner");
  
  if(!res.valid){
    sb.className="status-banner ok"; stxt.textContent = res.reason==="dims"?"Enter valid dimensions.":"Enter target requirement.";
    readoutLbl.textContent = state.calcMode==="vol2height"?"Target Fill Height":"Contained Volume";
    outH.innerHTML = state.calcMode==="vol2height" ? `0.0<span class="unit">${UNIT_LABEL[state.unit]}</span>` : `0<span class="unit">L</span>`;
    renderViz(0, false, null);
  } else {
    sb.className = res.over ? "status-banner overflow" : "status-banner ok";
    if (res.mode === "v2h") {
        stxt.textContent = res.over ? `Warning! Limit batch to ${fmt(res.maxCapL,0)} L.` : `Ready. ${fmt(res.liters,0)} L fits safely.`;
        readoutLbl.textContent = "Target Fill Height";
        outH.innerHTML = `${fmt(cmToUnit(res.h, state.unit),1)}<span class="unit">${UNIT_LABEL[state.unit]}</span>`;
    } else {
        stxt.textContent = res.over ? `Warning! Height exceeds tank max.` : `At this height, tank holds ${fmt(res.liters,0)} L.`;
        readoutLbl.textContent = "Contained Volume";
        outH.innerHTML = `${fmt(res.liters,0)}<span class="unit">L</span>`;
    }
    renderViz(res.pct, res.over, res);
  }
}

function renderViz(pct, over, res){
  pct = Math.max(0, Math.min(100, pct))/100;
  let cx=120, yTop=20, yBot=300, H=280, tY = yBot - pct*H;
  let water = pct>0 ? `<g style="transform:translateY(${yBot - pct*H}px)"><path d="M40,0 Q80,-5 120,0 T200,0 L200,300 L40,300 Z" fill="${over?'var(--red)':'var(--teal)'}" opacity="0.6"/></g>` : "";
  let lineText = res ? (res.mode==="v2h" ? fmt(cmToUnit(res.h, state.unit),1)+UNIT_LABEL[state.unit] : fmt(res.liters,0)+" L") : "";
  let line = res ? `<line x1="40" y1="${tY}" x2="200" y2="${tY}" stroke="${over?'var(--red)':'var(--amber)'}" stroke-width="2" stroke-dasharray="4"/><text x="205" y="${tY+4}" font-family="monospace" font-size="12" fill="${over?'var(--red)':'var(--amber)'}">${lineText}</text>` : "";
  
  $("tankSvg").innerHTML = `
    <rect x="55" y="${yTop}" width="130" height="${H}" rx="10" fill="var(--tank-fill)" stroke="var(--tank-outline)" stroke-width="2.5"/>
    <clipPath id="c"><rect x="55" y="${yTop}" width="130" height="${H}" rx="10"/></clipPath>
    <g clip-path="url(#c)">${water}</g>
    ${line}
  `;
}

popCap(); loadPreset(); refreshDims(); calcRender();
})();
</script>
</body>
</html>
